:root{
  --navy:#07152e;
  --navy2:#0b2347;
  --ink:#12233f;
  --gold:#d9a93d;
  --gold2:#f2c96a;
  --parchment:#f5edd8;
  --paper:#fffaf0;
  --surface:#fbf6e8;
  --line:#d7c9a6;
  --muted:#68778f;
  --bg:#f4ecd7;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scrollbar-color:#0b2347 #e8dcbd
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:radial-gradient(circle at 88% -10%, rgba(217,169,61,.28), transparent 34%), linear-gradient(180deg,#f8efd8 0,#eee1c0 100%)
}

.topbar{
  height:72px;
  max-width:1440px;
  margin:0 auto;
  padding:0 28px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #bda76d
}

.brand-mark{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--navy);
  color:var(--gold);
  display:grid;
  place-items:center;
  position:relative
}

.brand-mark span{
  position:absolute;
  font:750 11px "Fraunces",serif;
  color:#fff;
  bottom:4px
}

.brand-copy{
  display:flex;
  flex-direction:column;
  line-height:1
}

.brand-copy strong{
  font-family:"Fraunces",serif;
  font-size:23px;
  letter-spacing:.04em;
  color:var(--navy)
}

.brand-copy em{
  color:var(--gold);
  font-style:normal
}

.brand-copy small{
  font-size:9px;
  letter-spacing:.2em;
  color:#756b51
}

.live-pill{
  margin-left:16px;
  border:1px solid #bda76d;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  display:flex;
  gap:7px;
  align-items:center;
  background:#fff8e2
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%
}

.dot.amber{
  background:#d99a2c
}

.dot.green{
  background:#26875b
}

.header-note{
  margin-left:auto;
  font-family:"Fraunces",serif;
  font-size:15px;
  color:#24395e
}

main{
  max-width:1440px;
  margin:0 auto;
  padding:34px 28px 0
}

.hero{
  background:var(--navy);
  color:#f9f1d8;
  border-radius:26px;
  padding:42px 48px 30px;
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(7,21,46,.2)
}

.hero:after{
  content:"";
  position:absolute;
  width:440px;
  height:440px;
  border:1px solid rgba(217,169,61,.25);
  border-radius:50%;
  right:-130px;
  top:-150px;
  box-shadow:0 0 0 45px rgba(217,169,61,.05),0 0 0 90px rgba(217,169,61,.03)
}

.hero-eyebrow{
  color:var(--gold2);
  font-size:12px;
  font-weight:700;
  letter-spacing:.18em;
  display:flex;
  gap:8px;
  align-items:center
}

.hero h1{
  font-family:"Fraunces",serif;
  font-size:clamp(44px,6.2vw,84px);
  line-height:.95;
  letter-spacing:-.04em;
  margin:22px 0 18px;
  max-width:1000px
}

.hero h1 span{
  color:var(--gold2);
  font-weight:500
}

.hero-lede{
  max-width:720px;
  color:#c8d0dc;
  font-size:18px;
  line-height:1.55
}

.hero-stats{
  display:flex;
  gap:0;
  border-top:1px solid rgba(255,255,255,.14);
  margin-top:30px
}

.hero-stats div{
  padding:18px 28px 0 0;
  margin-right:28px;
  border-right:1px solid rgba(255,255,255,.08)
}

.hero-stats div:last-child{
  border:0
}

.hero-stats b{
  display:block;
  font-family:"Fraunces",serif;
  font-size:29px;
  color:#fff
}

.hero-stats span{
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#9eabb9
}

.now-playing{
  margin-top:26px;
  background:#f3e7c6;
  color:#12233f;
  border-radius:14px;
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  position:relative;
  z-index:1
}

.now-playing small{
  display:block;
  font-size:10px;
  letter-spacing:.16em;
  color:#765f28
}

.now-playing strong{
  font-size:14px
}

.now-playing svg{
  margin-left:auto;
  color:#8b6715
}

.eq{
  display:flex;
  gap:3px;
  align-items:end;
  height:24px
}

.eq i{
  display:block;
  width:4px;
  background:#a87b1b;
  animation:eq 1s ease-in-out infinite alternate
}

.eq i:nth-child(1){
  height:9px
}

.eq i:nth-child(2){
  height:18px;
  animation-delay:.1s
}

.eq i:nth-child(3){
  height:12px;
  animation-delay:.2s
}

.eq i:nth-child(4){
  height:20px
}

.eq i:nth-child(5){
  height:8px;
  animation-delay:.3s
}

@keyframes eq{
  to{
    height:23px
  }
}

.source-box{
  margin-top:22px;
  border:1px solid #b99f63;
  background:var(--paper);
  border-radius:18px;
  padding:22px 26px
}

.source-head{
  display:flex;
  align-items:center;
  gap:10px
}

.source-head h2{
  font-family:"Fraunces",serif;
  font-size:24px;
  margin:0
}

.source-badge{
  margin-left:auto;
  background:var(--navy);
  color:var(--gold2);
  padding:6px 9px;
  border-radius:999px;
  font-size:10px;
  letter-spacing:.12em
}

.source-grid{
  display:grid;
  grid-template-columns:1.3fr 1.3fr .9fr;
  gap:28px;
  margin-top:18px
}

.source-grid small{
  font-size:10px;
  letter-spacing:.16em;
  color:#8a7140;
  font-weight:700
}

.source-grid code{
  display:block;
  word-break:break-all;
  color:#17457e;
  font-size:12px;
  line-height:1.5;
  margin:7px 0
}

.source-grid p{
  font-size:13px;
  line-height:1.5;
  color:#5b6573;
  margin:0
}

.citation{
  margin-top:20px;
  padding-top:15px;
  border-top:1px dashed #cbbd90;
  font-size:12px;
  color:#6a603f
}

.console{
  margin-top:22px;
  background:#fffdf6;
  border:1px solid #c9b98d;
  border-radius:20px;
  padding:25px 28px;
  box-shadow:0 12px 30px rgba(60,44,8,.07)
}

.console-title{
  display:flex;
  align-items:end;
  justify-content:space-between
}

.kicker{
  font-size:11px;
  letter-spacing:.18em;
  font-weight:700;
  color:#8a6c22
}

.console h2{
  font-family:"Fraunces",serif;
  font-size:32px;
  margin:4px 0 0
}

.updated{
  font-size:12px;
  color:#748096
}

.controls{
  display:grid;
  grid-template-columns:1.15fr 1fr .5fr 1fr 1fr;
  gap:14px;
  align-items:stretch;
  margin-top:22px
}

.btn{
  border:0;
  border-radius:11px;
  padding:15px 16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:700;
  min-height:52px
}

.btn.primary{
  background:var(--navy);
  color:#fff
}

.btn.gold{
  background:var(--gold);
  color:#14263f
}

.btn.quiet{
  background:#eee2c4;
  color:#263a5a
}

.btn:disabled{
  opacity:.58;
  cursor:wait
}

.spin{
  animation:spin 1s linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.slider-block{
  border:1px solid #d9cda9;
  border-radius:11px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.slider-block label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px
}

  border-radius:14px;
  padding:20px

  line-height:1.6;
  color:#5b6573;
  margin:0 0 10px

.forecast-card p strong{

.forecast-example{

  color:#c8d0dc;

.v2-row{
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:14px;
  margin-top:16px
}

.record-box,.night-box{
  border:1px solid #d9cda9;
  border-radius:14px;
  padding:18px;
  background:#fffaf0
}

  display:flex;
  align-items:center;
  gap:10px
}

.record-head>div{
  display:flex;
  flex-direction:column
}

.record-head span{
  font-size:11px;
  color:#6a603f
}

  width:11px;
  height:11px;
  border-radius:50%;
  background:#c3b998

  background:#d92d20;

.btn.record{

.btn.stop-rec{

  color:#fff

.btn.download{

.record-audio{

.night-box small{

.test-bell-copy span{

  color:#5b6573;

.btn.test-bell-btn{

.test-countdown span{

}

.test-bar{

  background:#e5dab8;

.test-bar i{

  background:#0b2347;

.home-section{

.home-card{

.home-left{

.home-left h2{

}

.home-place{

.home-coords{

.home-rang{

.home-right svg{

.home-right strong{

}

.home-right small{
  position:absolute;
  bottom:38px;
  color:#aeb8c6
}

.home-bell{
  font-size:64px;
  color:#f2c96a
}

.home-ring{

  border:1px solid rgba(242,201,106,.5);

.home-ring.r2{

  opacity:.4

.near-banner{

  gap:12px;
  align-items:center

  display:flex;
  flex-direction:column
}

.near-banner span{
  font-size:12px;
  color:#5b6573
}

.near-banner .btn{
  margin-left:auto;

}

.near-none{
  font-size:12px;

.near-tag{

  background:#a4241d;

.table-wrap tr.near-home{

}

.table-wrap tr.near-home td{
  border-color:#e2c87a
}

.app-shell.night-mode .brand-copy strong{

.app-shell.night-mode .brand-copy small{

}

.app-shell.night-mode .header-note{

  color:#f6edd0

.app-shell.night-mode .slider-block{
  border-color:#2b4264

.app-shell.night-mode .status-line{

}

.app-shell.night-mode footer{
  border-color:#243a5c
}

.app-shell.night-mode .footer-mark{
  color:#f2c96a
}

.app-shell.night-mode .table-wrap th,.app-shell.night-mode .table-wrap td{
  border-color:#2b4264;
  color:#d8dee8
}

.app-shell.night-mode .table-wrap tr.near-home{
  background:#3a2d10
}

.app-shell.night-mode .near-banner{
  background:#3a2d10;
  border-color:#d9a93d;
  color:#f6edd0
}

.app-shell.night-mode .near-banner span{
  color:#c8d0dc
}

.night-sky{
  position:absolute;
  inset:0;
  pointer-events:none
}

.moon{
  position:absolute;
  right:78px;
  top:26px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#fdf3c8;
  box-shadow:0 0 30px 12px rgba(253,243,200,.35);
  z-index:1
}

.moon-glow{
  position:absolute;
  right:60px;
  top:8px;
  width:88px;
  height:88px;
  border-radius:50%;
  border:1px solid rgba(253,243,200,.28)
}

.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  animation:twinkle 2s ease-in-out infinite alternate;
  z-index:0
}

@keyframes twinkle{
  from{
    opacity:.25;
    transform:scale(.7)
  }

  to{
    opacity:1;
    transform:scale(1.25)
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#0a152a;
    --paper:#14273f;
    --surface:#12233c;
    --ink:#f0e8d1;
    --muted:#b8c0cc;
    --line:#38506f
  }

  body{
    background:#0a152a;
    color:#eee5c8
  }

  .app-shell{
    background:radial-gradient(circle at 88% -10%, rgba(217,169,61,.16), transparent 34%), linear-gradient(180deg,#0b1b33,#0a152a)
  }

  .source-box,.console,.table-wrap,.steps article{
    background:#14273f;
    border-color:#38506f;
    color:#eee5c8
  }

  .source-grid p,.steps p,.peaks-intro>p{
    color:#b7c0cd
  }

  .console h2,.section-heading h2,.source-head h2{
    color:#f6edd0
  }

  .table-wrap th,.table-wrap td{
    border-color:#38506f;
    color:#d8dee8
  }

  .table-wrap tr.is-playing{
    background:#3a2d10
  }

  .seg{
    background:#0a152a
  }

  .play-row,.now-playing{
    background:#f3e7c6;
    color:#12233f
  }

  .filters label{
    color:#d5dce6
  }

  .table-foot,.source-grid p{
    color:#aeb9c8
  }

  .how{
    background:#172a42;
    border-color:#38506f
  }

  .how-head h2{
    color:#f6edd0
  }
}
