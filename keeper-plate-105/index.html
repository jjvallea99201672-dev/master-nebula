:root{

  --navy-2:#0b1c38;
  --navy-3:#12264a;

  --gold-dim:#9c7a2d;
  --parchment:#f3ead3;
  --parchment-2:#e8dbbc;
  --parchment-dim:#c9b98f;

*{

}

html{

}

}

}

::selection{

}

.hover\:border-\[var\(--gold\)\]:hover{

}

}

.hover\:bg-white\/10:hover{

}

.hover\:text-\[var\(--gold-2\)\]:hover{
  color: var(--gold-2);
}

.hover\:text-\[var\(--parchment\)\]:hover{

}
