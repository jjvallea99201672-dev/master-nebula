<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quatrian Sigils — Node 05 Render — Jay Vallea</title>
<style>
  :root {
    --gold-dim: #e8c86a;
    --gold-glow: rgba(232, 200, 106, 0.4);
    --bg-void: #050508;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  .lattice-container {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4rem;
    flex-wrap: wrap;
    padding: 2rem;
  }

  .sigil-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fadeIn 1s ease-out forwards;
  }

  .sigil-wrapper:nth-child(1) { animation-delay: 0.2s; }
  .sigil-wrapper:nth-child(2) { animation-delay: 1.5s; }
  .sigil-wrapper:nth-child(3) { animation-delay: 2.8s; }

  .label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold-dim);
    margin-top: 1rem;
    opacity: 0.6;
    text-transform: uppercase;
  }

  /* SVG Base Styling */
  svg {
    overflow: visible;
  }
  
  .gold-stroke {
    stroke: var(--gold-dim);
    fill: none;
  }
  
  .gold-fill {
    fill: var(--gold-dim);
  }

  /* --- SKY ANIMATIONS --- */
  .sky-glow {
    animation: pulseGlow 4s infinite alternate ease-in-out;
  }
  
  .star {
    opacity: 0;
    animation: twinkle 3s infinite ease-in-out;
  }
  .star:nth-child(1) { animation-delay: 0.5s; }
  .star:nth-child(2) { animation-delay: 1.2s; }
  .star:nth-child(3) { animation-delay: 0.8s; }
  .star:nth-child(4) { animation-delay: 1.8s; }
  .star:nth-child(5) { animation-delay: 0.3s; }
  .star:nth-child(6) { animation-delay: 1.5s; }

  /* --- MOUNTAIN ANIMATIONS --- */
  .draw-path {
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
    animation: drawLine 2.5s ease-out forwards;
  }
  .mountain-wrapper .draw-path { animation-delay: 1.8s; }

  /* --- FIRE ANIMATIONS --- */
  .fire-wrapper .draw-path { animation-delay: 3.1s; }
  
  .flame-inner {
    transform-origin: 70px 104px;
    animation: flicker 2s infinite alternate ease-in-out;
    animation-delay: 5s;
  }

  /* --- KEYFRAMES --- */
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes pulseGlow {
    0% { filter: drop-shadow(0 0 4px var(--gold-glow)); }
    100% { filter: drop-shadow(0 0 12px var(--gold-glow)); }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @keyframes drawLine {
    to { stroke-dashoffset: 0; }
  }

  @keyframes flicker {
    0% { opacity: 0.7; transform: scale(0.98) translateY(1px); }
    25% { opacity: 1; transform: scale(1.02) translateY(-1px); }
    50% { opacity: 0.8; transform: scale(0.99) translateY(0); }
    75% { opacity: 1; transform: scale(1.01) translateY(-2px); }
    100% { opacity: 0.9; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
  <a href="../" style="position:fixed;top:10px;right:16px;z-index:50;color:#e8ddd0;font:11px/1.3 Courier New,Courier,monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.72">← Master Nebula</a>

</div>
