# Lattice Keeper + Redis. Copy .env.example to .env and fill in secrets first.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [backend]

  lattice-keeper:
    build:
      context: .
      args:
        EXTRAS: pqc        # use "pqc,rag" to include retrieval support
    image: lattice-keeper:0.30.0
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      KEYS_DIR: /data/keys
      # Inside a container "localhost" is the container itself; default to the compose ollama service.
      OLLAMA_HOST: ${COMPOSE_OLLAMA_HOST:-http://ollama:11434}
    ports:
      - "127.0.0.1:8765:8765"   # bind to localhost; put a TLS reverse proxy in front
    volumes:
      - keys:/data/keys
      # Operator PUBLIC key for signed policy (v0.30). Uncomment and set
      # OPERATOR_PUBKEY_FILE=/run/operator_pubkey.json in .env. Never mount the private key.
      # - ./operator_pubkey.json:/run/operator_pubkey.json:ro
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    restart: unless-stopped
    networks: [backend]

  # Optional local model for /rag_guard:  docker compose --profile ollama up
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    networks: [backend]

volumes:
  redis-data:
  keys:
  ollama:

networks:
  backend:
