[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "lattice-keeper"
version = "0.30.0"
description = "Signed record service with hybrid Ed25519 + ML-DSA-65 signatures, ML-KEM-768 encryption and a signed hash-chained audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jay Vallea" }]
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]
dependencies = [
  "aiohttp>=3.9,<4",
  "redis>=5.0,<9",
  "structlog>=24.1,<27",
  "cryptography>=42,<47",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
pqc = ["liboqs-python>=0.14,<0.17"]
rag = [
  "langchain-community>=0.3,<0.5",
  "langchain-ollama>=0.2,<2",
  "langchain-text-splitters>=0.3,<2",
  "faiss-cpu>=1.8,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-aiohttp>=1.0,<2",
  "pytest-asyncio>=0.23,<2",
  "fakeredis>=2.23,<3",
  "ruff>=0.6",
]

[project.scripts]
lattice-keeper = "lattice_keeper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lattice_keeper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["pqc: requires liboqs (skipped if unavailable)"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "ASYNC"]
ignore = ["S104", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
