<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MASTER NEBULA — Ultimate Beat Reactor — Jay Vallea</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; background: #000; }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 12px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: none;
            z-index: 200;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            border: 1px solid rgba(255,255,255,0.2);
            font-family: monospace;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            font-family: monospace;
        }
        
        button:hover { transform: scale(1.05); }
        
        .play-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 24px;
        }
        
        .record-btn {
            background: linear-gradient(135deg, #ff3366, #ff0066);
        }
        
        .record-btn.recording {
            animation: pulse 0.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px red; }
        }
        
        .mode-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #9b59b6, #e74c3c);
        }
        
        .effect-btn {
            background: rgba(255,255,255,0.15);
            font-size: 12px;
            padding: 8px 16px;
        }
        
        .effect-btn.active {
            background: linear-gradient(135deg, #f39c12, #e67e22);
        }
        
        .file-info, .bpm-display, .timer, .fps-display {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-family: monospace;
            font-weight: bold;
        }
        
        .bpm-display { color: #00ff88; font-size: 18px; }
        .fps-display { color: #ffaa00; }
        input[type="file"] { display: none; }
        
        .beat-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: rgba(255,255,255,0.1);
            z-index: 100;
            pointer-events: none;
        }
        
        .beat-flash {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #9b59b6, #e74c3c, #f39c12);
            width: 0%;
            transition: width 0.005s linear;
        }
        
        @media (max-width: 768px) {
            #controls { flex-direction: column; align-items: stretch; }
            .mode-buttons, .effect-buttons { justify-content: center; display: flex; flex-wrap: wrap; }
            button { font-size: 12px; padding: 8px 12px; }
        }
        
        .mode-buttons, .effect-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        
        .status-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #00ff88;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }
        
        .color-picker {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        
        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .color-dot:hover { transform: scale(1.2); }
        .color-dot.active { border-color: white; transform: scale(1.1); }
    </style>
</head>
<body>
  <a href="../" style="position:fixed;top:10px;right:16px;z-index:50;color:#e8ddd0;font:11px/1.3 Courier New,Courier,monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.72">← Master Nebula</a>
<div class="beat-bar">
        <div class="beat-flash" id="beatFlash"></div>
    </div>
    
    <div id="info">
        <h1>🌌 MASTER NEBULA 🌌</h1>
        <p>🔥 ULTIMATE BEAT REACTOR - MAXIMUM FEATURES 🔥</p>
    </div>
    
    <div id="controls">
        <input type="file" id="fileInput" accept="audio/*">
        <button id="uploadBtn">📁 UPLOAD</button>
        <button class="play-btn" id="playBtn">▶</button>
        <button class="record-btn" id="recordBtn">🔴 RECORD</button>
        
        <div class="mode-buttons">
            <button class="mode-btn" data-mode="nebula">🌌 NEBULA</button>
            <button class="mode-btn" data-mode="sphere">🌐 SPHERE</button>
            <button class="mode-btn" data-mode="cube">📦 CUBE</button>
            <button class="mode-btn" data-mode="particles">✨ PARTICLES</button>
            <button class="mode-btn" data-mode="torus">🌀 TORUS</button>
            <button class="mode-btn" data-mode="wave">🌊 WAVE</button>
            <button class="mode-btn" data-mode="vortex">⚡ VORTEX</button>
        </div>
        
        <div class="effect-buttons">
            <button class="effect-btn" data-effect="glow">✨ GLOW</button>
            <button class="effect-btn" data-effect="pulse">💫 PULSE</button>
            <button class="effect-btn" data-effect="rainbow">🌈 RAINBOW</button>
            <button class="effect-btn" data-effect="shockwave">💥 SHOCKWAVE</button>
        </div>
        
        <div class="color-picker">
            <div class="color-dot" style="background: #9b59b6;" data-color="purple"></div>
            <div class="color-dot" style="background: #e74c3c;" data-color="red"></div>
            <div class="color-dot" style="background: #00ff88;" data-color="green"></div>
            <div class="color-dot" style="background: #00ccff;" data-color="blue"></div>
            <div class="color-dot" style="background: #ffaa00;" data-color="orange"></div>
            <div class="color-dot active" style="background: linear-gradient(135deg, #9b59b6, #e74c3c);" data-color="nebula"></div>
        </div>
        
        <div class="bpm-display" id="bpmDisplay">BPM: --</div>
        <div class="fps-display" id="fpsDisplay">FPS: --</div>
        <div class="timer" id="timer">0:00</div>
        <div class="file-info" id="fileInfo">⚡ MAXIMUM FEATURES ⚡</div>
    </div>
    
    <div id="statusMsg" class="status-text" style="display: none;"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // ========== SCENE SETUP ==========
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.003);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        
        // Post Processing
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.8;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enableZoom = true;
        controls.enablePan = false;
        
        // ========== CREATE TEXT FOR ALL MODES ==========
        function createMasterNebulaText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, '#9b59b6');
            gradient.addColorStop(0.3, '#e74c3c');
            gradient.addColorStop(0.6, '#f39c12');
            gradient.addColorStop(1, '#9b59b6');
            ctx.font = 'Bold 70px "Segoe UI", "Arial Black"';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#9b59b6';
            ctx.fillStyle = gradient;
            ctx.fillText('🌌 MASTER NEBULA 🌌', canvas.width/2, canvas.height/2);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(7, 1.8, 1);
            sprite.position.set(0, 4, 0);
            return sprite;
        }
        
        const masterText = createMasterNebulaText();
        scene.add(masterText);
        
        // ========== LIGHTS ==========
        const ambientLight = new THREE.AmbientLight(0x111122);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(5, 10, 7);
        scene.add(mainLight);
        
        const backLight = new THREE.PointLight(0x4400ff, 0.5);
        backLight.position.set(0, 0, -5);
        scene.add(backLight);
        
        const colorLights = [];
        for (let i = 0; i < 12; i++) {
            const light = new THREE.PointLight(0xff00ff, 0.3);
            light.userData = { angle: (i / 12) * Math.PI * 2 };
            scene.add(light);
            colorLights.push(light);
        }
        
        // Stars
        const starCount = 4000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 400;
            starPos[i*3+1] = (Math.random() - 0.5) * 200;
            starPos[i*3+2] = (Math.random() - 0.5) * 150 - 75;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.5 }));
        scene.add(stars);
        
        // ========== MASTER NEBULA VISUAL ==========
        let nebulaRings = [];
        let nebulaOrbs = [];
        let nebulaParticles = null;
        
        function createMasterNebula() {
            const group = new THREE.Group();
            
            // Core
            const coreGeo = new THREE.SphereGeometry(0.9, 64, 64);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0x9b59b6, emissive: 0xe74c3c, emissiveIntensity: 0.6 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            group.add(core);
            
            // Particles
            const particleCount = 6000;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount; i++) {
                const radius = 2 + Math.random() * 5;
                const angle = Math.random() * Math.PI * 2;
                positions[i*3] = Math.cos(angle) * radius;
                positions[i*3+1] = (Math.random() - 0.5) * 3;
                positions[i*3+2] = Math.sin(angle) * radius;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const particleMat = new THREE.PointsMaterial({ color: 0xff66cc, size: 0.05, blending: THREE.AdditiveBlending });
            nebulaParticles = new THREE.Points(particleGeo, particleMat);
            group.add(nebulaParticles);
            
            // Rings
            for (let i = 0; i < 5; i++) {
                const ringGeo = new THREE.TorusGeometry(1.4 + i * 0.5, 0.04, 128, 200);
                const ringMat = new THREE.MeshStandardMaterial({ color: [0x9b59b6, 0xe74c3c, 0xf39c12, 0x00ff88, 0x00ccff][i % 5], emissive: 0x442244 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                group.add(ring);
                nebulaRings.push(ring);
            }
            
            // Orbs
            for (let i = 0; i < 48; i++) {
                const orbGeo = new THREE.SphereGeometry(0.08, 16, 16);
                const orbMat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0xff44aa });
                const orb = new THREE.Mesh(orbGeo, orbMat);
                const angle = (i / 48) * Math.PI * 2;
                orb.userData = { angle: angle, baseRadius: 2.3 };
                orb.position.x = Math.cos(angle) * 2.3;
                orb.position.z = Math.sin(angle) * 2.3;
                group.add(orb);
                nebulaOrbs.push(orb);
            }
            
            return group;
        }
        
        // ========== SPHERE ==========
        const sphereGeo = new THREE.IcosahedronGeometry(1.5, 1);
        const sphereMat = new THREE.MeshStandardMaterial({ color: 0x4ecdc4, emissive: 0x1a3a3a, metalness: 0.7 });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        const sphereWire = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: 0x4ecdc4, wireframe: true, transparent: true, opacity: 0.3 }));
        const sphereGroup = new THREE.Group();
        sphereGroup.add(sphere);
        sphereGroup.add(sphereWire);
        
        // ========== CUBE GRID ==========
        const cubeGroup = new THREE.Group();
        const cubes = [];
        for (let i = -6; i <= 6; i++) {
            for (let j = -6; j <= 6; j++) {
                const geo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
                const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL((i+j)/20, 0.8, 0.5) });
                const cube = new THREE.Mesh(geo, mat);
                cube.position.set(i * 0.65, Math.sin(i * 0.5) * 0.3, j * 0.65);
                cubes.push(cube);
                cubeGroup.add(cube);
            }
        }
        
        // ========== PARTICLES ==========
        const particleCount2 = 8000;
        const particleGeo2 = new THREE.BufferGeometry();
        const particlePos2 = new Float32Array(particleCount2 * 3);
        for (let i = 0; i < particleCount2; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePos2[i*3] = 3 * Math.sin(phi) * Math.cos(theta);
            particlePos2[i*3+1] = 3 * Math.sin(phi) * Math.sin(theta);
            particlePos2[i*3+2] = 3 * Math.cos(phi);
        }
        particleGeo2.setAttribute('position', new THREE.BufferAttribute(particlePos2, 3));
        const particles2 = new THREE.Points(particleGeo2, new THREE.PointsMaterial({ color: 0xff66cc, size: 0.05, blending: THREE.AdditiveBlending }));
        
        // ========== TORUS KNOT ==========
        const torusGeo = new THREE.TorusKnotGeometry(1.3, 0.3, 300, 40, 3, 4);
        const torusMat2 = new THREE.MeshStandardMaterial({ color: 0xff3366, emissive: 0x331122, metalness: 0.8 });
        const torusKnot = new THREE.Mesh(torusGeo, torusMat2);
        
        // ========== WAVE FIELD ==========
        const waveGroup = new THREE.Group();
        const wavePoints = [];
        for (let i = -20; i <= 20; i++) {
            for (let j = -20; j <= 20; j++) {
                const geo = new THREE.SphereGeometry(0.07, 8, 8);
                const ball = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x4ecdc4, emissive: 0x1a3a3a }));
                ball.userData = { x: i * 0.4, z: j * 0.4 };
                ball.position.set(i * 0.4, 0, j * 0.4);
                wavePoints.push(ball);
                waveGroup.add(ball);
            }
        }
        
        // ========== VORTEX ==========
        const vortexGroup = new THREE.Group();
        const vortexParticles = [];
        for (let i = 0; i < 3000; i++) {
            const geo = new THREE.SphereGeometry(0.06, 8, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff66cc, emissive: 0xff44aa });
            const particle = new THREE.Mesh(geo, mat);
            const radius = 1 + Math.random() * 4;
            const angle = Math.random() * Math.PI * 2;
            const height = (Math.random() - 0.5) * 5;
            particle.userData = { radius, angle, speed: 0.5 + Math.random() * 1, height };
            particle.position.x = Math.cos(angle) * radius;
            particle.position.z = Math.sin(angle) * radius;
            particle.position.y = height;
            vortexGroup.add(particle);
            vortexParticles.push(particle);
        }
        
        let masterNebula = createMasterNebula();
        
        scene.add(sphereGroup);
        scene.add(cubeGroup);
        scene.add(particles2);
        scene.add(torusKnot);
        scene.add(waveGroup);
        scene.add(vortexGroup);
        scene.add(masterNebula);
        
        let currentMode = 'nebula';
        let currentEffect = 'glow';
        let currentColor = 'nebula';
        let shockwaveActive = 0;
        
        function setMode(mode) {
            currentMode = mode;
            masterNebula.visible = mode === 'nebula';
            sphereGroup.visible = mode === 'sphere';
            cubeGroup.visible = mode === 'cube';
            particles2.visible = mode === 'particles';
            torusKnot.visible = mode === 'torus';
            waveGroup.visible = mode === 'wave';
            vortexGroup.visible = mode === 'vortex';
            masterText.visible = true;
            showStatus(`${mode.toUpperCase()} MODE`, '#9b59b6');
        }
        
        function setEffect(effect) {
            currentEffect = effect;
            if (effect === 'glow') {
                bloomPass.strength = 0.8;
                renderer.toneMappingExposure = 1.2;
            } else if (effect === 'pulse') {
                bloomPass.strength = 1.2;
            } else if (effect === 'rainbow') {
                bloomPass.strength = 1.0;
            } else if (effect === 'shockwave') {
                shockwaveActive = 1.0;
            }
            showStatus(`${effect.toUpperCase()} EFFECT`, '#f39c12');
        }
        
        function setColor(color) {
            currentColor = color;
            showStatus(`COLOR: ${color.toUpperCase()}`, '#00ff88');
        }
        
        // ========== AUDIO WITH MAXIMUM REACTIVITY ==========
        let audioContext = null;
        let analyser = null;
        let source = null;
        let audioBuffer = null;
        let isPlaying = false;
        
        let timeData = new Uint8Array(256);
        let beatValue = 0;
        let instantValue = 0;
        let lastPeak = 0;
        let fps = 0;
        let frameCount = 0;
        let lastFpsTime = performance.now();
        
        const beatFlash = document.getElementById('beatFlash');
        const statusMsgDiv = document.getElementById('statusMsg');
        const fpsDisplay = document.getElementById('fpsDisplay');
        
        function showStatus(msg, color = '#00ff88') {
            statusMsgDiv.textContent = msg;
            statusMsgDiv.style.display = 'block';
            statusMsgDiv.style.color = color;
            setTimeout(() => {
                statusMsgDiv.style.display = 'none';
            }, 2000);
        }
        
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        
        uploadBtn.addEventListener('click', () => fileInput.click());
        
        async function loadAudio(file) {
            const arrayBuffer = await file.arrayBuffer();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0;
            audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            document.getElementById('fileInfo').innerHTML = `🎵 ${file.name}`;
            showStatus('MAXIMUM REACTIVITY - PRESS PLAY', '#00ff88');
            
            // Calculate BPM
            const data = audioBuffer.getChannelData(0);
            let peaks = 0;
            for (let i = 1; i < data.length - 1; i += 5000) {
                if (Math.abs(data[i]) > 0.4) peaks++;
            }
            const bpm = 60 + Math.floor(peaks / 2);
            document.getElementById('bpmDisplay').innerHTML = `BPM: ${bpm}`;
        }
        
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('audio/')) {
                showStatus('Please upload an audio file!', '#ff6666');
                return;
            }
            showStatus(`Loading ${file.name}...`, '#ffaa00');
            try {
                await loadAudio(file);
            } catch (err) {
                showStatus(`ERROR: ${err.message}`, '#ff6666');
            }
        });
        
        function togglePlay() {
            if (!audioBuffer) {
                showStatus('UPLOAD AUDIO FIRST!', '#ff6666');
                return;
            }
            
            if (isPlaying) {
                if (source) source.stop();
                isPlaying = false;
                document.getElementById('playBtn').innerHTML = '▶';
                if (isRecording) stopRecording();
            } else {
                if (audioContext.state === 'suspended') audioContext.resume();
                source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                source.start();
                isPlaying = true;
                document.getElementById('playBtn').innerHTML = '⏸';
                showStatus('⚡ RAW AUDIO REACTIVITY ACTIVE ⚡', '#ff3366');
                lastPeak = 0;
            }
        }
        
        function updateRawBeat() {
            if (!isPlaying || !analyser) {
                beatValue *= 0.7;
                instantValue *= 0.6;
                return;
            }
            
            analyser.getByteTimeDomainData(timeData);
            
            let peak = 0;
            for (let i = 0; i < timeData.length; i++) {
                const value = Math.abs((timeData[i] - 128) / 128);
                if (value > peak) peak = value;
            }
            
            if (peak > 0.2 && peak > lastPeak * 1.4) {
                instantValue = 1.0;
                beatValue = 1.0;
                beatFlash.style.width = '100%';
                setTimeout(() => { beatFlash.style.width = '0%'; }, 50);
                if (currentEffect === 'shockwave') shockwaveActive = 1.0;
            } else {
                instantValue *= 0.5;
                beatValue = Math.max(0, beatValue * 0.6, peak * 2);
            }
            
            lastPeak = peak;
        }
        
        // ========== RECORDING ==========
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = 0;
        let recordingTimer = null;
        
        async function startRecording() {
            if (!isPlaying) {
                showStatus('PLAY AUDIO FIRST!', '#ff6666');
                return;
            }
            
            try {
                const stream = renderer.domElement.captureStream(30);
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `master_nebula_${Date.now()}.webm`;
                    a.click();
                    URL.revokeObjectURL(url);
                    document.getElementById('recordBtn').classList.remove('recording');
                    document.getElementById('recordBtn').innerHTML = '🔴 RECORD';
                    showStatus('✅ VIDEO SAVED!', '#00ff88');
                    if (recordingTimer) clearInterval(recordingTimer);
                    document.getElementById('timer').innerHTML = '0:00';
                };
                
                mediaRecorder.start(100);
                isRecording = true;
                recordingStartTime = Date.now();
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordBtn').innerHTML = '⏹️ STOP';
                
                recordingTimer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const mins = Math.floor(elapsed / 60);
                    const secs = elapsed % 60;
                    document.getElementById('timer').innerHTML = `🔴 ${mins}:${secs.toString().padStart(2,'0')}`;
                }, 1000);
                
                showStatus('🔴 RECORDING! 🔴', '#ff3366');
            } catch (err) {
                showStatus('Recording error: ' + err.message, '#ff6666');
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                if (recordingTimer) clearInterval(recordingTimer);
            }
        }
        
        function toggleRecording() {
            if (isRecording) stopRecording();
            else startRecording();
        }
        
        // ========== ANIMATION LOOP ==========
        let time = 0;
        let rainbowHue = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            rainbowHue += 0.01;
            
            // FPS Counter
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fps = frameCount;
                fpsDisplay.innerHTML = `FPS: ${fps}`;
                frameCount = 0;
                lastFpsTime = now;
            }
            
            updateRawBeat();
            
            const beat = instantValue;
            const intensity = beatValue;
            
            // Shockwave effect
            if (shockwaveActive > 0) {
                shockwaveActive *= 0.85;
                bloomPass.strength = 1.5 + shockwaveActive * 2;
            } else if (currentEffect === 'glow') {
                bloomPass.strength = 0.8 + beat * 0.5;
            } else if (currentEffect === 'pulse') {
                bloomPass.strength = 1.0 + beat * 1.5;
            } else if (currentEffect === 'rainbow') {
                bloomPass.strength = 1.0;
            }
            
            // Color management
            let mainColor, emissiveColor;
            if (currentColor === 'purple') {
                mainColor = 0x9b59b6; emissiveColor = 0xe74c3c;
            } else if (currentColor === 'red') {
                mainColor = 0xe74c3c; emissiveColor = 0xff0000;
            } else if (currentColor === 'green') {
                mainColor = 0x00ff88; emissiveColor = 0x00cc66;
            } else if (currentColor === 'blue') {
                mainColor = 0x00ccff; emissiveColor = 0x0066ff;
            } else if (currentColor === 'orange') {
                mainColor = 0xffaa00; emissiveColor = 0xff6600;
            } else {
                const hue = (time * 0.1 + rainbowHue) % 1;
                mainColor = new THREE.Color().setHSL(hue, 1, 0.6);
                emissiveColor = new THREE.Color().setHSL(hue, 1, 0.4);
            }
            
            // MASTER TEXT - ALWAYS VISIBLE, ALWAYS REACTIVE
            masterText.scale.set(7 + beat * 1.5, 1.8 + beat * 0.5, 1);
            masterText.material.opacity = 0.8 + beat * 0.5;
            if (currentEffect === 'rainbow') {
                const hue = rainbowHue % 1;
                masterText.material.color.setHSL(hue, 1, 0.6);
            }
            
            // ========== MODE-SPECIFIC UPDATES ==========
            
            if (currentMode === 'nebula') {
                const coreScale = 1.0 + beat * 1.0;
                if (masterNebula.children[0]) {
                    masterNebula.children[0].scale.set(coreScale, coreScale, coreScale);
                    masterNebula.children[0].material.emissiveIntensity = 0.5 + beat * 2.5;
                    if (currentColor !== 'nebula') {
                        masterNebula.children[0].material.color.setHex(mainColor);
                    }
                }
                
                nebulaRings.forEach((ring, i) => {
                    ring.rotation.z += 0.04 + beat * 0.25;
                    ring.scale.setScalar(1 + beat * 0.6);
                    ring.material.emissiveIntensity = 0.2 + beat * 2.0;
                });
                
                nebulaOrbs.forEach((orb, i) => {
                    const angle = time * (0.8 + beat * 1.8) + orb.userData.angle;
                    const radius = orb.userData.baseRadius + beat * 0.6;
                    orb.position.x = Math.cos(angle) * radius;
                    orb.position.z = Math.sin(angle) * radius;
                    orb.scale.setScalar(1 + beat * 1.2);
                    orb.material.emissiveIntensity = 0.3 + beat * 2.5;
                });
                
                if (nebulaParticles) {
                    nebulaParticles.material.color.setHex(mainColor);
                }
                masterNebula.rotation.y = time * 0.15;
            }
            
            else if (currentMode === 'sphere') {
                const scale = 1 + beat * 0.7;
                sphereGroup.scale.set(scale, scale, scale);
                sphereGroup.rotation.y = time * 0.5;
                sphereGroup.rotation.x = Math.sin(time * 0.3) * 0.3;
                sphereMat.emissiveIntensity = 0.3 + beat * 2.0;
                if (currentEffect === 'rainbow') {
                    const hue = rainbowHue % 1;
                    sphereMat.color.setHSL(hue, 1, 0.6);
                } else {
                    sphereMat.color.setHex(mainColor);
                }
            }
            
            else if (currentMode === 'cube') {
                cubes.forEach((cube, idx) => {
                    const scaleY = 0.3 + beat * 2.5 + intensity;
                    cube.scale.y = scaleY;
                    cube.material.emissiveIntensity = beat * 1.5;
                    if (currentEffect === 'rainbow') {
                        const hue = (rainbowHue + idx * 0.01) % 1;
                        cube.material.color.setHSL(hue, 1, 0.6);
                    } else {
                        cube.material.color.setHex(mainColor);
                    }
                });
                cubeGroup.rotation.y = time * 0.3;
                cubeGroup.rotation.x = Math.sin(time * 0.2) * 0.2;
            }
            
            else if (currentMode === 'particles') {
                particles2.rotation.y = time * 0.2;
                particles2.rotation.x = time * 0.1;
                particles2.material.color.setHex(mainColor);
                particles2.material.size = 0.05 + beat * 0.03;
            }
            
            else if (currentMode === 'torus') {
                torusKnot.rotation.x = time * 0.5;
                torusKnot.rotation.y = time * 0.3 + beat * 0.3;
                const scale = 1 + beat * 0.6;
                torusKnot.scale.set(scale, scale, scale);
                torusKnot.material.emissiveIntensity = 0.3 + beat * 2.0;
                torusKnot.material.color.setHex(mainColor);
            }
            
            else if (currentMode === 'wave') {
                wavePoints.forEach((point, idx) => {
                    const x = point.userData.x;
                    const z = point.userData.z;
                    const height = Math.sin(time * 3 + x * 1.2) * 0.2 +
                                   Math.cos(time * 2.5 + z * 1.2) * 0.2 +
                                   beat * 0.5;
                    point.position.y = height;
                    const hue = (height + 0.3) * 0.8;
                    point.material.color.setHSL(hue, 1, 0.5 + beat * 0.3);
                    point.material.emissiveIntensity = beat * 1.0;
                });
                waveGroup.rotation.y = time * 0.1;
            }
            
            else if (currentMode === 'vortex') {
                vortexParticles.forEach((part, idx) => {
                    const speed = part.userData.speed + beat * 2;
                    const newAngle = part.userData.angle + time * speed;
                    const radius = part.userData.radius + beat * 0.3;
                    part.position.x = Math.cos(newAngle) * radius;
                    part.position.z = Math.sin(newAngle) * radius;
                    part.position.y = part.userData.height + beat * 0.5;
                    part.scale.setScalar(1 + beat * 0.8);
                    part.material.emissiveIntensity = 0.2 + beat * 1.5;
                    part.material.color.setHex(mainColor);
                });
                vortexGroup.rotation.y = time * 0.1;
            }
            
            // Update lights
            colorLights.forEach((light, i) => {
                const angle = time * 0.6 + light.userData.angle;
                light.position.x = Math.cos(angle) * 8;
                light.position.z = Math.sin(angle) * 8;
                light.intensity = 0.3 + beat * 1.5;
                const hue = (rainbowHue + i * 0.05) % 1;
                light.color.setHSL(hue, 1, 0.6);
            });
            
            stars.rotation.y = time * 0.02;
            controls.update();
            effectComposer.render();
        }
        
        animate();
        
        // ========== EVENT LISTENERS ==========
        document.getElementById('playBtn').onclick = togglePlay;
        document.getElementById('recordBtn').onclick = toggleRecording;
        
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setMode(btn.dataset.mode);
            };
        });
        
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.effect-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setEffect(btn.dataset.effect);
            };
        });
        
        document.querySelectorAll('.color-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                setColor(dot.dataset.color);
            };
        });
        
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        };
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'KeyR') { e.preventDefault(); toggleRecording(); }
        });
        
        setMode('nebula');
        setEffect('glow');
        showStatus('🌌 MASTER NEBULA ULTIMATE - LOADED WITH FEATURES! Upload audio and press PLAY 🌌', '#9b59b6');
    </script>
</body>
</html>
