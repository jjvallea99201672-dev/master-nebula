:root{
  --navy:#0a152b;
  --navy-2:#122240;
  --navy-3:#1a2f52;
  --parchment:#f3ead3;
  --parchment-2:#e9dcbd;
  --parchment-3:#fffaf0;
  --gold:#c8a45f;
  --gold-2:#e7c989;
  --ink:#17233c;
  --muted:#6d6a58;
  --water:#4d9fc4;
  --water-2:#8fcbe8;
  --surface:#0a152b;
}

@media (prefers-color-scheme: dark){
  :root{
    --parchment:#efe5c9;
    --parchment-3:#fff8e6;
  }
}

*{
  box-sizing:border-box;
}

html{
  background:var(--navy);
}

body{
  margin:0;
  background:var(--navy);
  color:var(--parchment);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
}

.font-serif-display{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}

.gold-rule{
  height:2px;
  background:linear-gradient(90deg,var(--gold),transparent);
}

.thin-rule{
  height:1px;
  background:rgba(200,164,95,.45);
}

.parchment{
  background:var(--parchment);
  color:var(--ink);
}

.parchment-soft{
  background:var(--parchment-3);
  color:var(--ink);
}

/* Water animations */

@keyframes channelFlow{
  to{
    stroke-dashoffset:-28;
  }
}

@keyframes sheetFlow{
  0%{
    transform:translateX(-18%);
    opacity:.15;
  }

  45%{
    opacity:.75;
  }

  100%{
    transform:translateX(18%);
    opacity:.15;
  }
}

@keyframes poolPulse{
  0%,100%{
    transform:scaleX(1);
    opacity:.78;
  }

  50%{
    transform:scaleX(1.08);
    opacity:.95;
  }
}

@keyframes rainFall{
  0%{
    transform:translateY(-8px);
    opacity:0;
  }

  30%{
    opacity:.9;
  }

  100%{
    transform:translateY(34px);
    opacity:0;
  }
}

@keyframes drift{
  0%,100%{
    transform:translateX(0);
  }

  50%{
    transform:translateX(10px);
  }
}

@keyframes shimmer{
  0%,100%{
    opacity:.45;
  }

  50%{
    opacity:.95;
  }
}

@keyframes rise{
  from{
    transform:translateY(8px);
    opacity:0;
  }

  to{
    transform:translateY(0);
    opacity:1;
  }
}

.flow-line{
  stroke-dasharray:10 18;
  animation:channelFlow 1.1s linear infinite;
}

.sheet{
  animation:sheetFlow 3.2s ease-in-out infinite;
}

.sheet-slow{
  animation:sheetFlow 5.2s ease-in-out infinite;
}

.pool{
  transform-origin:center;
  transform-box:fill-box;
  animation:poolPulse 3s ease-in-out infinite;
}

.rain-drop{
  animation:rainFall 1.05s linear infinite;
}

.drift{
  animation:drift 5s ease-in-out infinite;
}

.shimmer{
  animation:shimmer 2.4s ease-in-out infinite;
}

.rise{
  animation:rise .45s ease both;
}

input[type="range"]{
  accent-color:var(--gold);
}

input[type="range"]::-webkit-slider-thumb{
  cursor:pointer;
}

button{
  font-family:inherit;
}

:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:3px;
}

.hover\:bg-\[\#17233c\]:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(23 35 60 / var(--tw-bg-opacity, 1));
}

.hover\:bg-\[rgba\(200\2c 164\2c 95\2c \.15\)\]:hover {
  background-color: rgba(200,164,95,.15);
}

.hover\:bg-\[rgba\(255\2c 255\2c 255\2c \.03\)\]:hover {
  background-color: rgba(255,255,255,.03);
}

.hover\:bg-white:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(255 255 255 / var(--tw-bg-opacity, 1));
}

.hover\:text-white:hover {
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}
