<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracks — Master Nebula — Jay Vallea</title>
<meta name="description" content="Listen to Master Nebula tracks in the browser. Rise Above, No Surrender, and more to come.">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../style.css">
<style>
  .listen{max-width:820px;margin:0 auto;padding:100px 20px 80px}
  .listen .back{display:inline-block;margin-bottom:28px;color:var(--dim);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
  .listen .back:hover{color:var(--cyan);text-shadow:var(--glow-c)}
  .listen .eyebrow{margin-bottom:10px}
  .listen h1{font-size:clamp(32px,6vw,52px);letter-spacing:.08em;line-height:1.15;margin:0 0 12px;
    background:linear-gradient(180deg,#fff,#a9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,229,255,.3))}
  .listen h1 span{background:linear-gradient(180deg,#ffe38a,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,200,61,.4))}
  .listen .lead{color:var(--dim);margin:0 0 36px;font-size:17px}
  .track-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
  .track{margin:0;padding:20px 22px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);
    box-shadow:0 0 0 1px rgba(0,229,255,.04)}
  .track:focus-within,.track.playing{border-color:var(--gold);box-shadow:var(--glow-g)}
  .track-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .track h2{margin:0;font-size:clamp(20px,3vw,26px);letter-spacing:.04em;color:var(--gold);text-shadow:0 0 16px rgba(255,200,61,.35)}
  .track .time{font:15px/1.3 Courier New,Courier,monospace;color:var(--cyan);text-shadow:var(--glow-c);white-space:nowrap}
  .track .artist{margin:0 0 14px;color:var(--dim);font-size:14px;letter-spacing:.16em;text-transform:uppercase}
  .track audio{width:100%;height:40px;color-scheme:dark}
  .track .row{margin-top:12px}
  .track .missing{display:none;margin:10px 0 0;color:var(--dim);font-size:13px}
  .track.unavailable .missing{display:block}
  .listen footer.page-end{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<a class="skip" href="#tracks">Skip to tracks</a>
<header class="nav">
  <a class="brand" href="../">MASTER <span>NEBULA</span></a>
  <button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu">☰</button>
  <nav id="menu">
    <a href="../#software">Software</a>
    <a href="./">Music</a>
    <a href="../#gallery">Gallery</a>
    <a href="../#physics">Physics</a>
    <a href="../#about">About</a>
  </nav>
</header>
<article class="listen" id="tracks">
  <a class="back" href="../#music">← Back to Master Nebula</a>
  <p class="eyebrow">Jay Vallea · Master Nebula</p>
  <h1>TRACKS</h1>
  <p class="lead">Songs you can play here, from Master Nebula. More will be added as they arrive.</p>
  <ol class="track-list" id="track-list"></ol>
  <footer class="page-end">Jay Vallea · JAY.01 · Master Nebula.</footer>
</article>
<script src="../script.js"></script>
<script>
(function () {
  var fallback = {
    artist: "Master Nebula",
    tracks: [
      { slug: "rise-above", title: "Rise Above", artist: "Master Nebula", duration: "4:09", src: "rise-above.mp3" },
      { slug: "no-surrender", title: "No Surrender", artist: "Master Nebula", duration: "4:11", src: "no-surrender.mp3" }
    ]
  };

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function render(data) {
    var list = document.getElementById("track-list");
    list.innerHTML = "";
    (data.tracks || []).forEach(function (t) {
      var audio = el("audio", { controls: "controls", preload: "metadata", src: t.src, title: t.title });
      var missing = el("p", { class: "missing", text: "This audio file is not on the server yet. It will play here after it is uploaded." });
      var article = el("li", { class: "track", id: t.slug }, [
        el("div", { class: "track-top" }, [
          el("h2", { text: t.title }),
          el("span", { class: "time", text: t.duration || "" })
        ]),
        el("p", { class: "artist", text: t.artist || data.artist || "Master Nebula" }),
        audio,
        missing,
        el("div", { class: "row" }, [
          el("a", { class: "btn", href: t.src, download: t.src, text: "Download" })
        ])
      ]);
      audio.addEventListener("play", function () {
        document.querySelectorAll("audio").forEach(function (a) { if (a !== audio) a.pause(); });
        article.classList.add("playing");
        article.classList.remove("unavailable");
      });
      audio.addEventListener("pause", function () { article.classList.remove("playing"); });
      audio.addEventListener("ended", function () { article.classList.remove("playing"); });
      audio.addEventListener("error", function () { article.classList.add("unavailable"); });
      list.appendChild(article);
    });
  }

  fetch("tracks.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("no json"); return r.json(); })
    .then(render)
    .catch(function () { render(fallback); });
})();
</script>
</body>
</html>
