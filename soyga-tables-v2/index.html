<body>
  <a href="../" style="position:fixed;top:10px;right:16px;z-index:50;color:#e8ddd0;font:11px/1.3 Courier New,Courier,monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.72">← Master Nebula</a>
    <div id="root"></div>

    <script type="module">
        // ============================================================
        // SOYGA TABLE GENERATOR - COMPLETE IMPLEMENTATION
        // ============================================================

        import React, { useState, useMemo, useEffect, useCallback, useRef } from "https://esm.sh/react@18.3.1";
        import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

        // ============================================================
        // CONSTANTS
        // ============================================================

        // Historical (Jim Reeds) - 23-letter alphabet
        const HIST_ALPH = "abcdefghiklmnopqrstuxyz";
        const HIST_F = [2, 2, 3, 5, 14, 2, 6, 5, 14, 15, 20, 22, 14, 8, 13, 20, 11, 8, 8, 15, 15, 15, 2];

        // Soul Forge (Creative) - 22-letter alphabet
        const SF_ALPH = "abcdefghiklmnopqrstxyz";
        const SF_F = [11, 3, 19, 12, 7, 14, 5, 21, 1, 9, 16, 0, 20, 2, 13, 18, 6, 10, 4, 8, 15, 17];

        // 36 Classical Seeds
        const CLASSICAL_SEEDS = [
            { num: 1, label: "ARIES", seed: "NISRAM" },
            { num: 2, label: "TAURUS", seed: "ROELER" },
            { num: 3, label: "GEMINI", seed: "IOMIOT" },
            { num: 4, label: "CANCER", seed: "ISIAPO" },
            { num: 5, label: "LEO", seed: "ORRASE" },
            { num: 6, label: "VIRGO", seed: "OSACUE" },
            { num: 7, label: "LIBRA", seed: "XUAUIR" },
            { num: 8, label: "SCORPIO", seed: "RAOSAC" },
            { num: 9, label: "SAGITTARIUS", seed: "RSADUA" },
            { num: 10, label: "CAPRICORNUS", seed: "ATROGA" },
            { num: 11, label: "AQUARIUS", seed: "SDUOLO" },
            { num: 12, label: "PISCES", seed: "ARICAA" },
            { num: 13, label: "ARIES-2", seed: "MARSIN" },
            { num: 14, label: "TAURUS-2", seed: "RELEOR" },
            { num: 15, label: "GEMINI-2", seed: "TOIMOI" },
            { num: 16, label: "CANCER-2", seed: "OPAISI" },
            { num: 17, label: "LEO-2", seed: "ESARRO" },
            { num: 18, label: "VIRGO-2", seed: "EUCASO" },
            { num: 19, label: "LIBRA-2", seed: "RIUAUX" },
            { num: 20, label: "SCORPIO-2", seed: "CASOAR" },
            { num: 21, label: "SAGITTARIUS-2", seed: "AUDASR" },
            { num: 22, label: "CAPRICORNUS-2", seed: "AGORTA" },
            { num: 23, label: "AQUARIUS-2", seed: "OLOUDS" },
            { num: 24, label: "PISCES-2", seed: "AACIRA" },
            { num: 25, label: "SATURNI", seed: "OSRESO" },
            { num: 26, label: "JOVIS", seed: "NIEBOA" },
            { num: 27, label: "MARTIS", seed: "OIAIAE" },
            { num: 28, label: "SOLIS", seed: "ITIABA" },
            { num: 29, label: "VENERIS", seed: "ADAMIS" },
            { num: 30, label: "MERCURII", seed: "REUELA" },
            { num: 31, label: "LUNAE", seed: "UISEUA" },
            { num: 32, label: "IGNIS", seed: "MERONF" },
            { num: 33, label: "AERIS", seed: "ILIOSU" },
            { num: 34, label: "AQUAE", seed: "OYNIND" },
            { num: 35, label: "TERRAI", seed: "IASULA" },
            { num: 36, label: "MAGISTRI", seed: "MOYSES" },
        ];

        // ============================================================
        // CORE GENERATOR
        // ============================================================

        function generateTable(seed, mode = "historical") {
            const alph = mode === "historical" ? HIST_ALPH : SF_ALPH;
            const fArr = mode === "historical" ? HIST_F : SF_F;
            const mod = alph.length;

            const l2n = (c) => {
                const idx = alph.indexOf(c.toLowerCase());
                return idx === -1 ? 0 : idx;
            };
            const n2l = (n) => {
                let v = ((n % mod) + mod) % mod;
                return alph[v];
            };
            const f = (letter) => fArr[l2n(letter)];

            // Normalize seed
            let s = seed.toLowerCase().slice(0, 6);
            while (s.length < 6) s += "a";

            const reverse = s.split("").reverse().join("");
            const pair = s + reverse;

            // Stage 1: Left column
            const leftCol = [];
            for (let i = 0; i < 36; i++) leftCol.push(pair[i % 12]);

            // Grid
            const grid = Array.from({ length: 36 }, () => Array(36).fill("a"));

            for (let r = 0; r < 36; r++) {
                for (let c = 0; c < 36; c++) {
                    if (c === 0) {
                        grid[r][c] = leftCol[r];
                    } else if (r === 0) {
                        const W = grid[0][c - 1];
                        grid[0][c] = n2l(l2n(W) + f(W));
                    } else {
                        const N = grid[r - 1][c];
                        const W = grid[r][c - 1];
                        grid[r][c] = n2l(l2n(N) + f(W));
                    }
                }
            }

            return {
                grid,
                leftCol,
                pair,
                seed: s.toUpperCase(),
                mode,
                alph,
                size: 36,
                totalCells: 1296,
            };
        }

        // ============================================================
        // EXPORT HELPERS
        // ============================================================

        function tableToText(data) {
            return data.grid.map((row) => row.join("").toUpperCase()).join("\n");
        }

        function tableToCSV(data) {
            const header = ["Row", ...Array.from({ length: 36 }, (_, i) => String(i))];
            const rows = data.grid.map((row, idx) => [idx, ...row.map((c) => c.toUpperCase())]);
            return [header, ...rows].map((r) => r.join(",")).join("\n");
        }

        function downloadFile(filename, content, mime = "text/plain") {
            const blob = new Blob([content], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadZip(files) {
            // Simple sequential download with delay
            let delay = 0;
            for (const file of files) {
                setTimeout(() => downloadFile(file.name, file.content, file.mime || "text/plain"), delay);
                delay += 100;
            }
        }

        // ============================================================
        // TABLE VIEW COMPONENT
        // ============================================================

        function TableView({ data, title }) {
            const [copied, setCopied] = useState(false);
            const text = useMemo(() => tableToText(data), [data]);

            const copy = async () => {
                try {
                    await navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1400);
                } catch {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1400);
                }
            };

            const exportTxt = () => {
                downloadFile(
                    `soyga_${data.seed}_${data.mode}.txt`,
                    `Book of Soyga — ${title}\nSeed: ${data.seed}\nMode: ${data.mode}\nSize: 36x36\n\n${text}\n`
                );
            };

            const exportCsv = () => {
                downloadFile(
                    `soyga_${data.seed}_${data.mode}.csv`,
                    `# Seed: ${data.seed}\n# Mode: ${data.mode}\n# Size: 36x36\n\n${tableToCSV(data)}`,
                    "text/csv"
                );
            };

            return React.createElement(
                "div",
                { className: "table-card" },
                // Header
                React.createElement(
                    "div",
                    { className: "table-header" },
                    React.createElement(
                        "div",
                        { style: { display: "flex", alignItems: "baseline", gap: "12px", flexWrap: "wrap" } },
                        React.createElement("span", { className: "table-title" }, title),
                        React.createElement("span", { className: "table-seed" }, data.seed),
                        React.createElement("span", { className: "table-meta" }, `L:${data.leftCol[0].toUpperCase()} · ${data.totalCells} cells · ${data.mode.toUpperCase()}`)
                    ),
                    React.createElement(
                        "div",
                        { className: "table-actions" },
                        React.createElement(
                            "button",
                            {
                                className: `table-btn ${copied ? 'copied' : ''}`,
                                onClick: copy,
                            },
                            copied ? "✅ COPIED" : "📋 COPY"
                        ),
                        React.createElement(
                            "button",
                            { className: "table-btn", onClick: exportTxt },
                            "📄 TXT"
                        ),
                        React.createElement(
                            "button",
                            { className: "table-btn", onClick: exportCsv },
                            "📊 CSV"
                        )
                    )
                ),
                // Grid
                React.createElement(
                    "div",
                    { className: "table-grid-wrap" },
                    React.createElement(
                        "div",
                        { className: "table-grid" },
                        data.grid.flatMap((row, r) =>
                            row.map((cell, c) => {
                                const isLeft = c === 0;
                                const isTop = r === 0 && c > 0;
                                return React.createElement(
                                    "div",
                                    {
                                        key: `${r}-${c}`,
                                        className: `table-cell ${isLeft ? 'left' : isTop ? 'top' : 'normal'}`,
                                    },
                                    cell.toUpperCase()
                                );
                            })
                        )
                    )
                ),
                // Footer
                React.createElement(
                    "div",
                    { className: "table-footer" },
                    React.createElement("span", null, `PAIR: ${data.pair.toUpperCase()}`),
                    React.createElement("span", null, `${data.totalCells} LETTERS`)
                )
            );
        }

        // ============================================================
        // MAIN APP
        // ============================================================

        function App() {
            const [mode, setMode] = useState("historical");
            const [seedInput, setSeedInput] = useState("NISRAM");
            const [activeSeed, setActiveSeed] = useState("NISRAM");
            const [error, setError] = useState(null);
            const [batchStatus, setBatchStatus] = useState("");
            const [isBatchRunning, setIsBatchRunning] = useState(false);

            const alph = mode === "historical" ? HIST_ALPH : SF_ALPH;

            const validate = useCallback((s) => {
                const g = s.toLowerCase();
                if (g.length !== 6) return "NEED EXACTLY 6 LETTERS";
                for (const ch of g) {
                    if (!alph.includes(ch)) return `BAD CHAR: ${ch.toUpperCase()} (allowed: ${alph.toUpperCase()})`;
                }
                return null;
            }, [alph]);

            useEffect(() => {
                setError(validate(seedInput));
            }, [seedInput, validate]);

            const ariesData = useMemo(() => generateTable("NISRAM", mode), [mode]);
            const dynamicData = useMemo(() => generateTable(activeSeed, mode), [activeSeed, mode]);

            const generate = () => {
                const err = validate(seedInput);
                if (err) {
                    setError(err);
                    return;
                }
                setError(null);
                setActiveSeed(seedInput.toUpperCase());
            };

            const batchExportAll = async () => {
                if (isBatchRunning) return;
                setIsBatchRunning(true);
                setBatchStatus("🌌 Generating 36 tables...");

                const files = [];
                let combined = `BOOK OF SOYGA — FULL SET OF 36 TABLES\nMode: ${mode}\nGenerated: ${new Date().toISOString()}\n\n`;

                for (const item of CLASSICAL_SEEDS) {
                    const data = generateTable(item.seed, mode);
                    const text = tableToText(data);
                    combined += `\n========== TABLE ${item.num}: ${item.label} — SEED ${item.seed} ==========\n${text}\n`;
                    files.push({
                        name: `soyga_${String(item.num).padStart(2, "0")}_${item.label}_${item.seed}.txt`,
                        content: `Table ${item.num}: ${item.label}\nSeed: ${item.seed}\nMode: ${mode}\n\n${text}\n`,
                    });
                }

                // Add master file
                files.push({
                    name: `soyga_ALL_36_TABLES_${mode}.txt`,
                    content: combined,
                });

                // Sequential download
                let delay = 0;
                for (const file of files) {
                    setTimeout(() => {
                        downloadFile(file.name, file.content);
                    }, delay);
                    delay += 150;
                }

                setBatchStatus(`✅ All ${files.length} files exported (individual + master)`);
                setTimeout(() => {
                    setBatchStatus("");
                    setIsBatchRunning(false);
                }, 4000);
            };

            const loadClassical = (seed) => {
                setSeedInput(seed);
                setActiveSeed(seed);
                setError(null);
            };

            return React.createElement(
                "div",
                { className: "soyga-root" },
                // Header
                React.createElement(
                    "div",
                    { className: "header" },
                    React.createElement(
                        "div",
                        null,
                        React.createElement(
                            "h1",
                            null,
                            "✦ SOYGA TABLE GENERATOR ✦",
                            React.createElement("span", { className: "highlight" }, " — HISTORICAL + SOUL FORGE")

                        React.createElement("div", { className: "header-sub" }, "36×36 · 1296 LETTERS · REEDS ALGORITHM · BATCH EXPORT")

                        "div",
                        { className: "mode-toggle" },

                                onClick: () => setMode("historical"),

                            "📜 HISTORICAL (REEDS)"

                        React.createElement(
                            "button",
                            {
                                className: `mode-btn soulforge ${mode === 'soulforge' ? 'active' : ''}`,
                                onClick: () => setMode("soulforge"),

                            "🔥 SOUL FORGE"
                        )

                // Controls

                    "div",
                    { className: "controls" },

                        "div",

                        React.createElement(
                            "div",
                            { className: "seed-input-group" },
                            React.createElement("label", null, "SEED [6 LETTERS]"),
                            React.createElement(
                                "div",
                                { className: "seed-input-wrap" },
                                React.createElement("input", {
                                    className: "seed-input",
                                    value: seedInput,
                                    onChange: (e) => setSeedInput(e.target.value.toUpperCase().slice(0, 6)),
                                    onKeyDown: (e) => e.key === "Enter" && generate(),
                                    placeholder: "NISRAM",
                                    spellCheck: false,
                                    autoFocus: true,
                                }),
                                React.createElement(
                                    "button",
                                    { className: "btn-generate", onClick: generate },
                                    "⚡ GENERATE"
                                )
                            ),
                            error && React.createElement("div", { className: "error-message" }, error)
                        ),
                        React.createElement(
                            "div",
                            { className: "stats" },
                            React.createElement(
                                "div",
                                null,
                                React.createElement("div", { className: "stat-label" }, "ACTIVE"),
                                React.createElement("div", { className: "stat-value" }, activeSeed),
                                React.createElement("div", { className: "stat-value gold" }, dynamicData.pair.toUpperCase())
                            ),
                            React.createElement(
                                "div",
                                null,
                                React.createElement("div", { className: "stat-label" }, "ALPHABET"),
                                React.createElement("div", null, `${alph.length} letters`),
                                React.createElement("div", { style: { color: "rgba(0,255,136,0.6)", fontSize: 10 } }, alph.toUpperCase())
                            ),
                            React.createElement(
                                "div",
                                null,
                                React.createElement("div", { className: "stat-label" }, "MODE"),
                                React.createElement("div", { className: "stat-value" }, mode === "historical" ? "REEDS 23" : "SOUL FORGE 22")
                            )
                        ),
                        React.createElement(
                            "div",
                            { style: { marginLeft: "auto", display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" } },
                            React.createElement(
                                "button",
                                {
                                    className: "btn-batch",
                                    onClick: batchExportAll,
                                    disabled: isBatchRunning,
                                },
                                isBatchRunning ? "⏳ EXPORTING..." : "📦 BATCH EXPORT ALL 36"
                            ),
                            batchStatus && React.createElement("div", { className: "batch-status" }, batchStatus)
                        )
                    )
                ),
                // Classical Seeds
                React.createElement(
                    "div",
                    { className: "classical-seeds" },
                    React.createElement("div", { className: "classical-seeds-label" }, "📜 CLASSICAL SEEDS (click to load)"),
                    React.createElement(
                        "div",
                        { className: "classical-seeds-grid" },
                        CLASSICAL_SEEDS.map((item) =>
                            React.createElement(
                                "button",
                                {
                                    key: item.num,

                    )

                // Tables
                React.createElement(
                    "div",
                    { className: "tables-grid" },
                    React.createElement(TableView, {

                    })
                ),
                // Logic
                React.createElement(
                    "div",
                    { className: "logic-section" },
                    React.createElement(
                        "div",
                        { className: "logic-box" },
                        React.createElement("div", { className: "logic-title" }, "🔮 GENERATION LOGIC"),
                        React.createElement(
                            "div",
                            { className: "logic-grid" },

                                "div",
                                { className: "logic-step" },

                                React.createElement("div", { className: "logic-step-desc" }, "seed (6) + reverse(seed) = 12 chars"),
                                React.createElement("div", { className: "logic-step-desc" }, "repeat to fill 36 rows")
                            ),
                            React.createElement(
                                "div",
                                { className: "logic-step" },
                                React.createElement("div", { className: "logic-step-title step2" }, "STAGE 2 — TOP ROW"),
                                React.createElement("div", { className: "logic-step-desc" }, "X = (W + f(W)) mod alphabet_size"),
                                React.createElement("div", { className: "logic-step-desc" }, "W = letter to the west")
                            ),
                            React.createElement(
                                "div",
                                { className: "logic-step" },
                                React.createElement("div", { className: "logic-step-title step3" }, "STAGE 3 — INTERIOR"),
                                React.createElement("div", { className: "logic-step-desc" }, "X = (N + f(W)) mod alphabet_size"),
                                React.createElement("div", { className: "logic-step-desc" }, "N = north, W = west")
                            )
                        ),
                        React.createElement(
                            "div",
                            { className: "logic-footer" },
                            mode === "historical" ?
                                "📜 HISTORICAL mode uses Jim Reeds’ exact 23-letter alphabet and f-table recovered from the Bodley / Sloane manuscripts. Tables match the original Book of Soyga construction." :
                                "🔥 SOUL FORGE mode uses the creative 22-letter alphabet and f-table from the original Soul Forge generator. Suitable for custom ritual / artistic work."
                        )
                    )
                ),
                React.createElement("div", { className: "app-footer" }, "DEE · SOYGA · REEDS · 36×36 · HISTORICAL / SOUL FORGE · 432Hz · PUMP 220")
            );
        }

        // ============================================================
        // RENDER
        // ============================================================

        const root = createRoot(document.getElementById("root"));
        root.render(React.createElement(App));

        // ============================================================
        // CONSOLE
        // ============================================================

        console.log(`
        ╔══════════════════════════════════════════════════════════════╗
        ║                                                              ║
        ║              SOYGA TABLE GENERATOR                          ║
        ║              Historical + Soul Forge                        ║

        ║    "The forge speaks in Soyga."                            ║

        ╚══════════════════════════════════════════════════════════════╝
        `);

        console.log('🔥 SOYGA GENERATOR ACTIVE');
        console.log(`📜 Mode: ${mode === 'historical' ? 'HISTORICAL (REEDS)' : 'SOUL FORGE'}`);
