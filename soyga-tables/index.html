<body>
  <a href="../" style="position:fixed;top:10px;right:16px;z-index:50;color:#e8ddd0;font:11px/1.3 Courier New,Courier,monospace;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.72">← Master Nebula</a>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useMemo, useEffect, useCallback } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

    // ===================== HISTORICAL (REEDS) CONSTANTS =====================
    // 23-letter alphabet: a-z excluding j, v, w
    const HIST_ALPH = "abcdefghiklmnopqrstuxyz";
    // f values indexed by position in HIST_ALPH (0-based)
    // Matches Jim Reeds / OEIS A346223 / Cipher Mysteries
    const HIST_F = [2,2,3,5,14,2,6,5,14,15,20,22,14,8,13,20,11,8,8,15,15,15,2];

    // ===================== SOUL FORGE (CREATIVE) CONSTANTS =====================
    const SF_ALPH = "abcdefghiklmnopqrstxyz"; // 22 letters (original app)
    const SF_F = [11,3,19,12,7,14,5,21,1,9,16,0,20,2,13,18,6,10,4,8,15,17];

    // ===================== CLASSICAL 36 SEEDS =====================
    const CLASSICAL_SEEDS = [
      { num: 1,  label: "ARIES",        seed: "NISRAM" },
      { num: 2,  label: "TAURUS",       seed: "ROELER" },
      { num: 3,  label: "GEMINI",       seed: "IOMIOT" },
      { num: 4,  label: "CANCER",       seed: "ISIAPO" },
      { num: 5,  label: "LEO",          seed: "ORRASE" },
      { num: 6,  label: "VIRGO",        seed: "OSACUE" },
      { num: 7,  label: "LIBRA",        seed: "XUAUIR" },
      { num: 8,  label: "SCORPIO",      seed: "RAOSAC" },
      { num: 9,  label: "SAGITTARIUS",  seed: "RSADUA" },
      { num: 10, label: "CAPRICORNUS",  seed: "ATROGA" },
      { num: 11, label: "AQUARIUS",     seed: "SDUOLO" },
      { num: 12, label: "PISCES",       seed: "ARICAA" },
      { num: 13, label: "ARIES-2",      seed: "MARSIN" },
      { num: 14, label: "TAURUS-2",     seed: "RELEOR" },
      { num: 15, label: "GEMINI-2",     seed: "TOIMOI" },
      { num: 16, label: "CANCER-2",     seed: "OPAISI" },
      { num: 17, label: "LEO-2",        seed: "ESARRO" },
      { num: 18, label: "VIRGO-2",      seed: "EUCASO" },
      { num: 19, label: "LIBRA-2",      seed: "RIUAUX" },
      { num: 20, label: "SCORPIO-2",    seed: "CASOAR" },
      { num: 21, label: "SAGITTARIUS-2",seed: "AUDASR" },
      { num: 22, label: "CAPRICORNUS-2",seed: "AGORTA" },
      { num: 23, label: "AQUARIUS-2",   seed: "OLOUDS" },
      { num: 24, label: "PISCES-2",     seed: "AACIRA" },
      { num: 25, label: "SATURNI",      seed: "OSRESO" },
      { num: 26, label: "JOVIS",        seed: "NIEBOA" },
      { num: 27, label: "MARTIS",       seed: "OIAIAE" },
      { num: 28, label: "SOLIS",        seed: "ITIABA" },
      { num: 29, label: "VENERIS",      seed: "ADAMIS" },
      { num: 30, label: "MERCURII",     seed: "REUELA" },
      { num: 31, label: "LUNAE",        seed: "UISEUA" },
      { num: 32, label: "IGNIS",        seed: "MERONF" },
      { num: 33, label: "AERIS",        seed: "ILIOSU" },
      { num: 34, label: "AQUAE",        seed: "OYNIND" },
      { num: 35, label: "TERRAI",       seed: "IASULA" },
      { num: 36, label: "MAGISTRI",     seed: "MOYSES" },
    ];

    // ===================== CORE GENERATOR =====================
    function generateTable(seed, mode = "historical") {
      const alph = mode === "historical" ? HIST_ALPH : SF_ALPH;
      const fArr = mode === "historical" ? HIST_F : SF_F;
      const mod = alph.length;

      const l2n = (c) => {
        const idx = alph.indexOf(c.toLowerCase());
        return idx === -1 ? 0 : idx;
      };
      const n2l = (n) => {
        let v = ((n % mod) + mod) % mod;
        return alph[v];
      };
      const f = (letter) => fArr[l2n(letter)];

      seed = seed.toLowerCase().slice(0, 6);
      // pad if needed (should be 6)
      while (seed.length < 6) seed += "a";

      const reverse = seed.split("").reverse().join("");
      const pair = seed + reverse; // 12 chars

      // Stage 1 — left column
      const leftCol = [];
      for (let i = 0; i < 36; i++) leftCol.push(pair[i % 12]);

      // Grid
      const grid = Array.from({ length: 36 }, () => Array(36).fill("a"));

      for (let r = 0; r < 36; r++) {
        for (let c = 0; c < 36; c++) {
          if (c === 0) {
            grid[r][c] = leftCol[r];
          } else if (r === 0) {
            // Stage 2 — top row: X = W + f(W)
            const W = grid[0][c - 1];
            grid[0][c] = n2l(l2n(W) + f(W));
          } else {
            // Stage 3 — interior: X = N + f(W)
            const N = grid[r - 1][c];
            const W = grid[r][c - 1];
            grid[r][c] = n2l(l2n(N) + f(W));
          }
        }
      }

      return {
        grid,
        leftCol,
        pair,
        seed: seed.toUpperCase(),
        mode,
        alph,
      };
    }

    // ===================== EXPORT HELPERS =====================
    function tableToText(data) {
      return data.grid.map((row) => row.join("").toUpperCase()).join("\n");
    }

    function tableToCSV(data) {
      const header = ["Row", ...Array.from({ length: 36 }, (_, i) => String(i))];
      const rows = data.grid.map((row, idx) => [idx, ...row.map((c) => c.toUpperCase())]);
      return [header, ...rows].map((r) => r.join(",")).join("\n");
    }

    function downloadFile(filename, content, mime = "text/plain") {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ===================== COMPONENTS =====================
    function TableView({ data, title }) {
      const [copied, setCopied] = useState(false);

      const text = useMemo(() => tableToText(data), [data]);

      const copy = async () => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1400);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 1400);
        }
      };

      const exportTxt = () => {
        downloadFile(
          `soyga_${data.seed}_${data.mode}.txt`,
          `Book of Soyga — ${title}\nSeed: ${data.seed}\nMode: ${data.mode}\nSize: 36x36\n\n${text}\n`
        );
      };

      const exportCsv = () => {
        downloadFile(
          `soyga_${data.seed}_${data.mode}.csv`,
          `# Seed: ${data.seed}\n# Mode: ${data.mode}\n# Size: 36x36\n\n${tableToCSV(data)}`,
          "text/csv"
        );
      };

      return React.createElement(
        "div",
        {
          className: "flex flex-col border rounded-sm overflow-hidden",
          style: { borderColor: "rgba(0,255,136,0.2)", background: "#111" },
        },
        // header
        React.createElement(
          "div",
          {
            className: "flex items-center justify-between px-3 py-2 border-b",
            style: { borderColor: "rgba(0,255,136,0.15)", background: "#0e0e0e" },
          },
          React.createElement(
            "div",
            { className: "flex items-baseline gap-3 flex-wrap" },
            React.createElement("span", { style: { fontSize: 11, letterSpacing: "0.2em", color: "rgba(0,255,136,0.6)" } }, title),
            React.createElement("span", { style: { fontSize: 13, fontWeight: 700, letterSpacing: "0.1em", color: "#00ff88" } }, data.seed),
            React.createElement(
              "span",
              { style: { fontSize: 10, color: "rgba(255,140,66,0.8)" } },
              `L:${data.leftCol[0].toUpperCase()} · 36×36=1296 · ${data.mode.toUpperCase()}`
            )
          ),
          React.createElement(
            "div",
            { className: "flex gap-2" },
            React.createElement(
              "button",
              {
                onClick: copy,
                style: {
                  fontSize: 10,
                  padding: "4px 10px",
                  border: "1px solid rgba(0,255,136,0.3)",
                  background: "transparent",
                  color: "#00ff88",
                  letterSpacing: "0.1em",
                },
              },
              copied ? "COPIED" : "COPY"
            ),
            React.createElement(
              "button",
              {
                onClick: exportTxt,
                style: {
                  fontSize: 10,
                  padding: "4px 10px",
                  border: "1px solid rgba(0,255,136,0.3)",
                  background: "transparent",
                  color: "#00ff88",
                  letterSpacing: "0.1em",
                },
              },
              "TXT"
            ),
            React.createElement(
              "button",
              {
                onClick: exportCsv,
                style: {
                  fontSize: 10,
                  padding: "4px 10px",
                  border: "1px solid rgba(0,255,136,0.3)",
                  background: "transparent",
                  color: "#00ff88",
                  letterSpacing: "0.1em",
                },
              },
              "CSV"
            )
          )
        ),
        // grid
        React.createElement(
          "div",
          { style: { overflow: "auto", background: "#0a0a0a", maxWidth: "100%" } },
          React.createElement(
            "div",
            { style: { display: "inline-block", padding: 8 } },
            React.createElement(
              "div",
              {
                style: {
                  display: "grid",
                  gridTemplateColumns: "repeat(36, minmax(0, 1fr))",
                  gap: 0,
                },
              },
              data.grid.flatMap((row, r) =>
                row.map((cell, c) => {
                  const isLeft = c === 0;
                  const isTop = r === 0 && c > 0;
                  return React.createElement(
                    "div",
                    {
                      key: `${r}-${c}`,
                      style: {
                        width: 18,
                        height: 18,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontSize: 11,
                        lineHeight: 1,
                        fontFamily: "inherit",
                        userSelect: "none",
                        color: isLeft ? "#ff8c42" : "#00ff88",
                        fontWeight: isLeft ? 700 : 400,
                        background: isLeft
                          ? "rgba(255,140,66,0.07)"
                          : isTop
                          ? "rgba(0,255,136,0.04)"
                          : "transparent",
                        borderRight: isLeft ? "1px solid rgba(255,140,66,0.2)" : "none",
                        borderBottom: isTop ? "1px solid rgba(0,255,136,0.2)" : "none",
                      },
                    },
                    cell.toUpperCase()
                  );
                })
              )
            )
          )
        ),
        // footer
        React.createElement(
          "div",
          {
            className: "px-3 py-1.5 border-t flex gap-4",
            style: { borderColor: "rgba(0,255,136,0.1)", fontSize: 10, color: "rgba(0,255,136,0.5)" },
          },
          React.createElement("span", null, `PAIR: ${data.pair.toUpperCase()}`),
          React.createElement("span", { style: { marginLeft: "auto" } }, "1296 LETTERS")
        )
      );
    }

    function App() {
      const [mode, setMode] = useState("historical"); // "historical" | "soulforge"
      const [seedInput, setSeedInput] = useState("NISRAM");
      const [activeSeed, setActiveSeed] = useState("NISRAM");
      const [error, setError] = useState(null);
      const [batchStatus, setBatchStatus] = useState("");

      const alph = mode === "historical" ? HIST_ALPH : SF_ALPH;

      const validate = useCallback(
        (s) => {
          const g = s.toLowerCase();
          if (g.length !== 6) return "NEED EXACTLY 6 LETTERS";
          for (const ch of g) {
            if (!alph.includes(ch)) return `BAD CHAR: ${ch.toUpperCase()} (allowed: ${alph.toUpperCase()})`;
          }
          return null;
        },
        [alph]
      );

      useEffect(() => {
        setError(validate(seedInput));
      }, [seedInput, validate]);

      const ariesData = useMemo(() => generateTable("NISRAM", mode), [mode]);
      const dynamicData = useMemo(() => generateTable(activeSeed, mode), [activeSeed, mode]);

      const generate = () => {
        const err = validate(seedInput);
        if (err) {
          setError(err);
          return;
        }
        setError(null);
        setActiveSeed(seedInput.toUpperCase());
      };

      const batchExportAll = async () => {
        setBatchStatus("Generating 36 tables…");
        // Create a zip-like multi-file download via sequential downloads + a combined text
        let combined = `BOOK OF SOYGA — FULL SET OF 36 TABLES\nMode: ${mode}\nGenerated: ${new Date().toISOString()}\n\n`;
        const zipParts = [];

        for (const item of CLASSICAL_SEEDS) {
          const data = generateTable(item.seed, mode);
          const text = tableToText(data);
          combined += `\n========== TABLE ${item.num}: ${item.label} — SEED ${item.seed} ==========\n${text}\n`;
          // also trigger individual downloads with slight delay to avoid browser blocking
          setTimeout(() => {
            downloadFile(
              `soyga_${String(item.num).padStart(2, "0")}_${item.label}_${item.seed}.txt`,
              `Table ${item.num}: ${item.label}\nSeed: ${item.seed}\nMode: ${mode}\n\n${text}\n`
            );
          }, item.num * 120);
        }

        // Master combined file
        setTimeout(() => {
          downloadFile(`soyga_ALL_36_TABLES_${mode}.txt`, combined);
          setBatchStatus("All 36 tables exported (individual + combined master file).");
          setTimeout(() => setBatchStatus(""), 4000);
        }, 4500);
      };

      const loadClassical = (seed) => {
        setSeedInput(seed);
        setActiveSeed(seed);
        setError(null);
      };

      return React.createElement(
        "div",
        { style: { minHeight: "100vh", background: "#0a0a0a", color: "#00ff88", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" } },

        // Header
        React.createElement(
          "div",
          { style: { borderBottom: "1px solid rgba(0,255,136,0.2)", background: "rgba(14,14,14,0.85)", backdropFilter: "blur(8px)" } },
          React.createElement(
            "div",
            { style: { maxWidth: 1600, margin: "0 auto", padding: "16px 24px", display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 12 } },
            React.createElement(
              "div",
              null,
              React.createElement(
                "h1",
                { style: { margin: 0, fontSize: 16, letterSpacing: "0.25em", fontWeight: 700 } },
                "SOYGA TABLE GENERATOR — ",
                React.createElement("span", { style: { color: "#ff8c42" } }, "HISTORICAL + SOUL FORGE")
              ),
              React.createElement(
                "div",
                { style: { fontSize: 10, color: "rgba(0,255,136,0.4)", letterSpacing: "0.15em", marginTop: 4 } },
                "36×36 · 1296 LETTERS · REEDS ALGORITHM · BATCH EXPORT"
              )
            ),
            // Mode toggle
            React.createElement(
              "div",
              { style: { display: "flex", gap: 8, alignItems: "center" } },
              React.createElement(
                "button",
                {
                  onClick: () => setMode("historical"),
                  style: {
                    padding: "6px 14px",
                    fontSize: 11,
                    letterSpacing: "0.15em",
                    fontWeight: 700,
                    border: mode === "historical" ? "1px solid #00ff88" : "1px solid rgba(0,255,136,0.25)",
                    background: mode === "historical" ? "#00ff88" : "transparent",
                    color: mode === "historical" ? "#000" : "#00ff88",
                  },
                },
                "HISTORICAL (REEDS)"
              ),
              React.createElement(
                "button",
                {
                  onClick: () => setMode("soulforge"),
                  style: {
                    padding: "6px 14px",
                    fontSize: 11,
                    letterSpacing: "0.15em",
                    fontWeight: 700,
                    border: mode === "soulforge" ? "1px solid #ff8c42" : "1px solid rgba(255,140,66,0.3)",
                    background: mode === "soulforge" ? "#ff8c42" : "transparent",
                    color: mode === "soulforge" ? "#000" : "#ff8c42",
                  },
                },
                "SOUL FORGE"
              )
            )
          )
        ),

        // Controls
        React.createElement(
          "div",
          { style: { maxWidth: 1600, margin: "0 auto", padding: "16px 24px" } },
          React.createElement(
            "div",
            {
              style: {
                display: "flex",
                flexWrap: "wrap",
                alignItems: "flex-end",
                gap: 16,
                border: "1px solid rgba(0,255,136,0.15)",
                background: "#111",
                padding: 16,
                borderRadius: 2,
              },
            },
            // Seed input
            React.createElement(
              "div",
              { style: { display: "flex", flexDirection: "column", gap: 4 } },
              React.createElement(
                "label",
                { style: { fontSize: 10, letterSpacing: "0.2em", color: "rgba(0,255,136,0.6)" } },
                "SEED [6 LETTERS]"
              ),
              React.createElement(
                "div",
                { style: { display: "flex", gap: 8 } },
                React.createElement("input", {
                  value: seedInput,
                  onChange: (e) => setSeedInput(e.target.value.toUpperCase().slice(0, 6)),
                  onKeyDown: (e) => e.key === "Enter" && generate(),
                  style: {
                    width: 180,
                    background: "#0a0a0a",
                    border: "1px solid rgba(0,255,136,0.3)",
                    outline: "none",
                    padding: "8px 12px",
                    fontSize: 16,
                    letterSpacing: "0.3em",
                    fontWeight: 700,
                    color: "#00ff88",
                  },
                  placeholder: "NISRAM",
                  spellCheck: false,
                }),
                React.createElement(
                  "button",
                  {
                    onClick: generate,
                    style: {
                      padding: "8px 20px",
                      background: "#00ff88",
                      color: "#000",
                      fontSize: 11,
                      fontWeight: 700,
                      letterSpacing: "0.2em",
                      border: "none",
                    },
                  },
                  "GENERATE"
                )
              ),
              error &&
                React.createElement("div", { style: { fontSize: 10, color: "#ff4d4d", letterSpacing: "0.1em", marginTop: 4 } }, error)
            ),

            // Stats
            React.createElement(
              "div",
              { style: { display: "flex", gap: 24, fontSize: 11, lineHeight: 1.4 } },
              React.createElement(
                "div",
                null,
                React.createElement("div", { style: { color: "rgba(0,255,136,0.4)", fontSize: 10, letterSpacing: "0.15em" } }, "ACTIVE"),
                React.createElement("div", { style: { fontWeight: 700, letterSpacing: "0.1em" } }, activeSeed),
                React.createElement("div", { style: { color: "#ff8c42", letterSpacing: "0.1em" } }, dynamicData.pair.toUpperCase())
              ),
              React.createElement(
                "div",
                null,
                React.createElement("div", { style: { color: "rgba(0,255,136,0.4)", fontSize: 10, letterSpacing: "0.15em" } }, "ALPHABET"),
                React.createElement("div", null, `${alph.length} letters`),
                React.createElement("div", { style: { color: "rgba(0,255,136,0.6)", fontSize: 10 } }, alph.toUpperCase())
              ),
              React.createElement(
                "div",
                null,
                React.createElement("div", { style: { color: "rgba(0,255,136,0.4)", fontSize: 10, letterSpacing: "0.15em" } }, "MODE"),
                React.createElement("div", { style: { fontWeight: 700 } }, mode === "historical" ? "REEDS 23" : "SOUL FORGE 22")
              )
            ),

            // Batch button
            React.createElement(
              "div",
              { style: { marginLeft: "auto", display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end" } },
              React.createElement(
                "button",
                {
                  onClick: batchExportAll,
                  style: {
                    padding: "8px 16px",
                    fontSize: 11,
                    letterSpacing: "0.15em",
                    fontWeight: 700,
                    border: "1px solid #ff8c42",
                    background: "rgba(255,140,66,0.1)",
                    color: "#ff8c42",
                  },
                },
                "BATCH EXPORT ALL 36"
              ),
              batchStatus &&
                React.createElement("div", { style: { fontSize: 10, color: "rgba(0,255,136,0.7)" } }, batchStatus)
            )
          )
        ),

        // Classical seed quick buttons
        React.createElement(
          "div",
          { style: { maxWidth: 1600, margin: "0 auto", padding: "0 24px 16px" } },
          React.createElement(
            "div",
            { style: { fontSize: 10, letterSpacing: "0.2em", color: "rgba(0,255,136,0.5)", marginBottom: 8 } },
            "CLASSICAL SEEDS (click to load)"
          ),
          React.createElement(
            "div",
            { style: { display: "flex", flexWrap: "wrap", gap: 6 } },
            CLASSICAL_SEEDS.map((item) =>
              React.createElement(
                "button",
                {
                  key: item.num,
                  onClick: () => loadClassical(item.seed),
                  style: {
                    fontSize: 10,
                    padding: "4px 8px",
                    border: activeSeed === item.seed ? "1px solid #00ff88" : "1px solid rgba(0,255,136,0.2)",
                    background: activeSeed === item.seed ? "rgba(0,255,136,0.15)" : "transparent",
                    color: activeSeed === item.seed ? "#00ff88" : "rgba(0,255,136,0.7)",
                    letterSpacing: "0.05em",
                  },
                  title: `${item.label} — ${item.seed}`,
                },
                `${item.num}.${item.seed}`
              )
            )
          )
        ),

        // Two tables
        React.createElement(
          "div",
          {
            style: {
              maxWidth: 1600,
              margin: "0 auto",
              padding: "0 24px 24px",
              display: "grid",
              gridTemplateColumns: "repeat(auto-fit, minmax(480px, 1fr))",
              gap: 16,
            },
          },
          React.createElement(TableView, {
            data: ariesData,
            title: "ARIES / TABLE 1 — FIXED (NISRAM)",
          }),
          React.createElement(TableView, {
            data: dynamicData,
            title: `DYNAMIC — ${activeSeed}`,
          })
        ),

        // Logic notes
        React.createElement(
