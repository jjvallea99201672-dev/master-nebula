:root{

  --surface:#0d1430;

  --parchment:#f2dfae;
  --parchment2:#d9c48f;

  --gold2:#ffdf85;
  --blue:#7aa7ff;
  --blue2:#2d4aa8;
  --ink:#f7eecf;
  --muted:#a9b2d4;
  --line:rgba(233,185,74,.34);
  --red:#ff8b7a;
  --green:#8fe6b6;
}

@media (prefers-color-scheme: light){
  :root{
    --bg:#f4e9c8;
    --surface:#fff6d9;
    --surface2:#eee0b4;
    --parchment:#171c38;
    --parchment2:#3b3f66;
    --gold:#8a6110;
    --gold2:#9a7410;
    --blue:#25459b;
    --blue2:#d7e0ff;
    --ink:#171c38;
    --muted:#535779;
    --line:rgba(120,90,10,.35);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Fraunces",Georgia,serif
}

.mono{
  font-family:"IBM Plex Mono",ui-monospace,monospace
}

.chalk{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  letter-spacing:.02em
}

.gold-rule{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)
}

.starfield{
  background-image:radial-gradient(circle at 12% 20%, rgba(255,255,255,.9) 0 1px, transparent 1.5px),radial-gradient(circle at 78% 12%, rgba(255,223,133,.9) 0 1px, transparent 1.5px),radial-gradient(circle at 62% 38%, rgba(255,255,255,.55) 0 1px, transparent 1.5px),radial-gradient(circle at 32% 72%, rgba(122,167,255,.8) 0 1px, transparent 1.5px),radial-gradient(circle at 88% 68%, rgba(255,255,255,.65) 0 1px, transparent 1.5px)
}

.parchment-card{
  background:linear-gradient(135deg, rgba(242,223,174,.13), rgba(217,196,143,.05));
  border:1px solid var(--line)
}

input[type="range"]{
  accent-color:var(--gold);
  width:100%
}

::-moz-selection{
  background:var(--gold);
  color:#111
}

::selection{
  background:var(--gold);
  color:#111
}

.last\:pb-0:last-child{
  padding-bottom: 0px;
}

.hover\:border-\[var\(--gold\)\]:hover{
  border-color: var(--gold);
}

.hover\:bg-\[var\(--gold\)\]:hover{
  background-color: var(--gold);
}

.hover\:text-black:hover{
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:inline{
    display: inline;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:p-9{
    padding: 2.25rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:px-8{
    padding-left: 2rem;
    padding-right: 2rem;
  }

  .sm\:py-12{
    padding-top: 3rem;
    padding-bottom: 3rem;
  }

  .sm\:py-14{
    padding-top: 3.5rem;
    padding-bottom: 3.5rem;
  }

  .sm\:py-4{
    padding-top: 1rem;
    padding-bottom: 1rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-\[42px\]{
    font-size: 42px;
  }

  .sm\:text-\[92px\]{
    font-size: 92px;
  }

  .sm\:text-base{
    font-size: 1rem;
    line-height: 1.5rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xs{
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{

  }
}
