:root {
  --navy: #081426;
  --navy-2: #0c1e3a;
  --navy-3: #12294c;
  --parchment: #f1e7d0;
  --parchment-2: #e9dcc0;
  --parchment-3: #dccfae;
  --gold: #c8a12e;
  --gold-soft: #e5c65c;
  --ink: #17233a;
  --muted: #8d9db4;
  --line: rgba(200, 161, 46, 0.42);
}

@media (prefers-color-scheme: dark) {
  :root {
    --navy: #071223;
    --parchment: #f1e7d0;
    --gold: #d4af37;
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--navy);
}

body {
  margin: 0;
  background: var(--navy);
  color: var(--parchment);
  font-family: "Cormorant Garamond", Georgia, serif;
}

a {
  color: inherit;
}

button {
  font-family: inherit;
}

.mono {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
}

.serif {
  font-family: "Cormorant Garamond", Georgia, serif;
}

.gold-rule {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.parchment-panel {
  background: linear-gradient(180deg, #f6eedb, #ecdfc2);
  color: #1d2a3d;
  box-shadow: 0 22px 60px rgba(0,0,0,.38), inset 0 0 0 1px rgba(94,70,24,.22);
}

.hairline {
  border: 1px solid var(--line);
}

.dropcap::first-letter {
  float: left;
  font-size: 4.6rem;
  line-height: .78;
  padding: .55rem .7rem 0 0;
  color: #9a7612;
  font-weight: 700;
}

@keyframes pulse-bar {
  0%,100% {
    transform: scaleY(.35);
  }

  50% {
    transform: scaleY(1);
  }
}

.wave-bar {
  transform-origin: center;
  animation: pulse-bar 1.15s ease-in-out infinite;
}

@keyframes drift {
  0% {
    transform: translateX(-8%);
  }

  100% {
    transform: translateX(8%);
  }
}

.drift {
  animation: drift 9s ease-in-out infinite alternate;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-up {
  animation: fadeUp .35s ease both;
}
